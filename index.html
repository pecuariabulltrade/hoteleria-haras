<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hotelería El Haras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fija con período y modo; navegación por pestañas; cada pestaña es una tabla de trabajo ancha con resumen arriba. */
:root{
  --bg:#f4f3ee; --panel:#ffffff; --panel2:#ebe9e1; --fg:#1f241d; --muted:#5f665a; --line:#d6d4c9;
  --accent:#3b6a3a; --accent-fg:#ffffff; --accent-soft:#e3eddf;
  --ok:#2d7a3a; --warn:#b2721a; --bad:#b23a2e; --bad-soft:#f6e1de; --warn-soft:#f7ecd7;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171a16; --panel:#20241f; --panel2:#2a2f28; --fg:#e8e8e0; --muted:#a3a99c; --line:#3a4038;
  --accent:#7fb37a; --accent-fg:#101510; --accent-soft:#2b3a2a;
  --ok:#7fc98a; --warn:#e0a84a; --bad:#e3756a; --bad-soft:#4a2a27; --warn-soft:#4a3d22; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171a16; --panel:#20241f; --panel2:#2a2f28; --fg:#e8e8e0; --muted:#a3a99c; --line:#3a4038;
  --accent:#7fb37a; --accent-fg:#101510; --accent-soft:#2b3a2a;
  --ok:#7fc98a; --warn:#e0a84a; --bad:#e3756a; --bad-soft:#4a2a27; --warn-soft:#4a3d22; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:17px} h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.small{padding:3px 8px;font-size:12.5px}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 7px;min-width:0}
input[type=number]{font-family:var(--mono);text-align:right;width:7.5em}
input.cab{width:5.5em}
input.date{width:9.5em}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:2px;padding:8px 16px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:transparent;padding:8px 12px;color:var(--muted);white-space:nowrap}
nav.tabs button.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600;background:var(--panel)}
main{padding-block:16px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:10px}
.panel header .sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel2);border-radius:6px;padding:10px 12px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--muted);font-family:var(--font)}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.n input{text-align:right}
tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--panel2)}
tr.sub td{color:var(--muted)}
td.bad{color:var(--bad);font-weight:600} td.ok{color:var(--ok)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--panel2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.cierto{background:#e4ecf6;color:#2c5a8a} .tag.propio{background:var(--accent-soft);color:var(--accent)} .tag.no_propio{background:var(--warn-soft);color:var(--warn)} .tag.residual{background:var(--panel2);color:var(--fg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.cierto{background:#27384d;color:#9dc0e8} }
:root[data-theme="dark"] .tag.cierto{background:#27384d;color:#9dc0e8}
/* liquidación */
.liq{background:var(--panel);color:var(--fg);max-width:860px;margin:0 auto;padding:28px 32px;border:1px solid var(--line);border-radius:8px}
.liq .head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:10px}
.liq .head .emp b{font-size:18px;display:block}
.liq .head .emp span{display:block;font-size:12px;color:var(--muted)}
.liq .head .doc{text-align:right}
.liq .head .doc b{display:block;font-size:15px;letter-spacing:.08em}
.liq h3{margin:18px 0 6px}
.liq table th{position:static;background:transparent}
.liq .tot{display:grid;grid-template-columns:1fr auto;gap:4px 24px;max-width:400px;margin-left:auto;margin-top:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.liq .tot span:nth-child(even){text-align:right}
.liq .tot .lab{font-family:var(--font);color:var(--muted)}
.liq .tot .final{font-weight:700;font-size:17px;border-top:2px solid var(--fg);padding-top:6px}
.liq .ind{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
.liq .ind b{color:var(--fg);font-family:var(--mono)}
@media print{
  body{background:#fff;color:#000} .topbar,nav.tabs,.noprint{display:none!important}
  main{padding:0} .liq{border:0;max-width:none;padding:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Hotelería El Haras — app de facturación de hoteleros
   Un solo archivo. Estado = documento JSON del período (ver esquema abajo).
   Persistencia: localStorage (modo local) o Supabase (tablas normalizadas).
   ===================================================================== */

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const fmtN = (v, d = 0) => { if (v === null || v === undefined || isNaN(v)) return ''; let n = Number(v); if (Math.abs(n) < Math.pow(10, -d) / 2) n = 0; return n.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }); };
const fmt$ = v => fmtN(v, 2);
const fmtPct = v => fmtN(v * 100, 1) + ' %';
const fmtFecha = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '';
const fmtMes = mes => { const [y, m] = mes.split('-'); return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+m - 1] + ' ' + y; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const uid = () => Math.random().toString(36).slice(2, 9);
function diasDelMes(mes) { const [y, m] = mes.split('-').map(Number); const out = []; const d = new Date(Date.UTC(y, m - 1, 1)); while (d.getUTCMonth() === m - 1) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } return out; }
function mesSiguiente(mes) { const [y, m] = mes.split('-').map(Number); const d = new Date(Date.UTC(y, m, 1)); return d.toISOString().slice(0, 7); }
let toastT; function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

// ---------- esquema del documento de período ----------
const TRATAMIENTOS = {
  cierto:    { nombre: 'Alimento cierto',   desc: 'Se le asignan los kilos reales de sus corrales (± ajuste kg/día).' },
  propio:    { nombre: 'Alimento propio',   desc: 'kg/cab base del día × cabezas del hotelero.' },
  no_propio: { nombre: 'No propio',         desc: 'kg/cab base del día × (1 + % ajuste) × cabezas.' },
  residual:  { nombre: 'Residual',          desc: 'Recibe lo que falta para cerrar el total del día (PEGSA).' },
};
function periodoVacio(mes) {
  return {
    version: 1,
    periodo: { mes, markup: 0.15, precio_hoteleria: 450, precio_sanidad: 7758, iva: 0.21, estado: 'abierto' },
    // tipo de precio: fijo (base mensual + % merma) | maiz (cotización de mercado − flete + flete corto, con piso) | silo (fórmula sobre el maíz) | manual (se carga por día)
    insumos: [
      { nombre: 'GLUTEN DE MAIZ', humedad: 0.58, tipo: 'fijo', base: 0, merma: 0.05 }, { nombre: 'MAIZ GRANO', humedad: 0.13, tipo: 'maiz' }, { nombre: 'OTROS', humedad: 0, tipo: 'manual' },
      { nombre: 'NUCLEO CONC 5% LDB', humedad: 0.05, tipo: 'fijo', base: 0, merma: 0.05 }, { nombre: 'ROLLO HENO', humedad: 0.18, tipo: 'manual' }, { nombre: 'SILO DE MAIZ', humedad: 0.49, tipo: 'silo' },
      { nombre: 'HOMINY FEED', humedad: 0.22, tipo: 'manual' }, { nombre: 'HARINA GERMEN', humedad: 0.01, tipo: 'fijo', base: 0, merma: 0.05 },
    ],
    precios_config: {
      maiz: { flete_largo: 0, flete_corto: 0, piso: 0, cotizaciones: [] },   // cotizaciones: [{fecha, precio_tn}] del mercado (Cañuelas / Rosario), $/tn
      silo: { adicional: 14.5, rendimiento: 7350, factor: 0.87 },           // silo $/kg = (maíz $/kg + adicional) × rendimiento × factor / 10000
    },
    hoteleros: [],      // {id,nombre,razon_social,cuit,tratamiento,ajuste_pct,ajuste_kg,corrales[],stock_inicial,precio_hoteleria(null=general),paga_hoteleria,paga_sanidad,activo}
    alimentacion: [],   // {fecha,corral,insumo,kg}
    movimientos: [],    // {fecha,hotelero,tipo:'ingreso'|'egreso'|'mortandad',cabezas,tropa,sanidad,origen:'sistema'|'manual'}
    precios: [],        // {fecha,insumo,precio}
    stock_sugerido: {}, // {hotelero_id: cabezas al 1° del mes según WinCampo (solo referencia)}
  };
}

// precio de hotelería del hotelero: propio si lo tiene, si no el general del período
const precioHot = (h, P) => (h.precio_hoteleria !== null && h.precio_hoteleria !== undefined && h.precio_hoteleria !== '') ? +h.precio_hoteleria : P.precio_hoteleria;

// ---------- motor de cálculo ----------
// Devuelve { dias, res:{hid:{...}}, control:[...] }. Misma lógica que tools/motor_ref.py.
function calcular(data) {
  const P = data.periodo, dias = diasDelMes(P.mes);
  const insumos = data.insumos.map(i => i.nombre);
  const hots = data.hoteleros.filter(h => h.activo !== false);
  const byid = Object.fromEntries(hots.map(h => [h.id, h]));
  const corral2hot = {};
  hots.filter(h => h.tratamiento === 'cierto').forEach(h => (h.corrales || []).forEach(c => corral2hot[c] = h.id));
  const tot = {}, cierto = {};
  dias.forEach(d => { tot[d] = {}; cierto[d] = {}; });
  for (const a of data.alimentacion) {
    if (!tot[a.fecha]) continue;
    tot[a.fecha][a.insumo] = (tot[a.fecha][a.insumo] || 0) + a.kg;
    const hid = corral2hot[a.corral];
    if (hid) { const c = cierto[a.fecha][hid] || (cierto[a.fecha][hid] = {}); c[a.insumo] = (c[a.insumo] || 0) + a.kg; }
  }
  const precio = {}; data.precios.forEach(p => precio[p.fecha + '|' + p.insumo] = p.precio);
  const mov = {}; const mv = (h, d) => mov[h + '|' + d] || (mov[h + '|' + d] = { ing: 0, egr: 0, mor: 0, san: 0 });
  for (const m of data.movimientos) {
    const r = mv(m.hotelero, m.fecha);
    if (m.tipo === 'ingreso') { r.ing += m.cabezas; if (m.sanidad) r.san += m.cabezas; }
    else if (m.tipo === 'egreso') r.egr += m.cabezas; else if (m.tipo === 'mortandad') r.mor += m.cabezas;
  }
  const stock = Object.fromEntries(hots.map(h => [h.id, h.stock_inicial || 0]));
  const res = Object.fromEntries(hots.map(h => [h.id, { h, dias: [], kg: Object.fromEntries(insumos.map(i => [i, 0])), kg_tot: 0, alimento: 0, alimento_ins: Object.fromEntries(insumos.map(i => [i, 0])), hoteleria: 0, sanidad: 0, cab_dias: 0, ingresos: 0, egresos: 0, mortandad: 0, cab_sanidad: 0 }]));
  const control = []; const mk = 1 + P.markup;
  for (const d of dias) {
    for (const h of hots) { const m = mv(h.id, d); stock[h.id] += m.ing - m.egr - m.mor; }
    const totalDia = Object.values(tot[d]).reduce((a, b) => a + b, 0);
    const kgH = {};
    // 1) ciertos
    for (const h of hots) if (h.tratamiento === 'cierto') {
      let base = { ...(cierto[d][h.id] || {}) }; const s = Object.values(base).reduce((a, b) => a + b, 0);
      const adj = +h.ajuste_kg || 0;
      if (s > 0 && adj) { const f = (s + adj) / s; for (const k in base) base[k] *= f; }
      kgH[h.id] = base;
    }
    const resto = {}; insumos.forEach(i => resto[i] = (tot[d][i] || 0) - Object.values(kgH).reduce((a, k) => a + (k[i] || 0), 0));
    const restoTot = insumos.reduce((a, i) => a + resto[i], 0);
    const baseHeads = hots.filter(h => h.tratamiento !== 'cierto').reduce((a, h) => a + stock[h.id], 0);
    const kgcab = baseHeads ? restoTot / baseHeads : 0;
    const prop = {}; insumos.forEach(i => prop[i] = restoTot ? resto[i] / restoTot : 0);
    // 2) propios / no propios
    for (const h of hots) {
      let k;
      if (h.tratamiento === 'propio') k = kgcab * stock[h.id];
      else if (h.tratamiento === 'no_propio') k = kgcab * (1 + (+h.ajuste_pct || 0)) * stock[h.id];
      else continue;
      kgH[h.id] = Object.fromEntries(insumos.map(i => [i, k * prop[i]]));
    }
    // 3) residual
    for (const h of hots) if (h.tratamiento === 'residual')
      kgH[h.id] = Object.fromEntries(insumos.map(i => [i, resto[i] - Object.entries(kgH).filter(([x]) => x !== h.id && byid[x].tratamiento !== 'cierto').reduce((a, [, k]) => a + (k[i] || 0), 0)]));
    const asignado = Object.values(kgH).reduce((a, k) => a + Object.values(k).reduce((x, y) => x + y, 0), 0);
    const porHot = Object.fromEntries(hots.map(h => [h.id, Object.values(kgH[h.id] || {}).reduce((a, b) => a + b, 0)]));
    control.push({ fecha: d, total: totalDia, asignado, dif: totalDia - asignado, kgcab, cabezas: Object.values(stock).reduce((a, b) => a + b, 0), baseHeads, porHot, stock: { ...stock }, conDatos: totalDia > 0 });
    for (const h of hots) {
      const r = res[h.id], kg = kgH[h.id] || {}, m = mv(h.id, d);
      const kgt = Object.values(kg).reduce((a, b) => a + b, 0);
      let ali = 0; for (const i of insumos) { const v = (kg[i] || 0) * (precio[d + '|' + i] || 0) * mk; ali += v; r.alimento_ins[i] += v; r.kg[i] += kg[i] || 0; }
      const hot = h.paga_hoteleria !== false ? stock[h.id] * precioHot(h, P) : 0;
      const san = h.paga_sanidad !== false ? m.san * P.precio_sanidad * mk : 0;
      r.kg_tot += kgt; r.alimento += ali; r.hoteleria += hot; r.sanidad += san; r.cab_dias += stock[h.id];
      r.ingresos += m.ing; r.egresos += m.egr; r.mortandad += m.mor; r.cab_sanidad += m.san;
      r.dias.push({ fecha: d, stock: stock[h.id], ing: m.ing, egr: m.egr, mor: m.mor, kg: kgt, kgcab: stock[h.id] ? kgt / stock[h.id] : 0, alimento: ali, hoteleria: hot, sanidad: san, kgIns: kg });
    }
  }
  for (const r of Object.values(res)) {
    r.stock_final = r.dias.length ? r.dias[r.dias.length - 1].stock : r.h.stock_inicial;
    r.stock_prom = r.cab_dias / dias.length;
    r.subtotal = r.alimento + r.hoteleria + r.sanidad;
    r.iva = r.subtotal * P.iva; r.total = r.subtotal + r.iva;
    r.kgcab = r.cab_dias ? r.kg_tot / r.cab_dias : 0;
    r.precio_racion = r.kg_tot ? r.alimento / r.kg_tot : 0;
    r.kg_ms = data.insumos.reduce((a, i) => a + (r.kg[i.nombre] || 0) * (1 - (i.humedad || 0)), 0);
    r.precio_ms = r.kg_ms ? r.alimento / r.kg_ms : 0;
    const hum = data.insumos.reduce((a, i) => a + (r.kg[i.nombre] || 0) * (i.humedad || 0), 0);
    r.ms = r.kg_tot ? 1 - hum / r.kg_tot : 0;
  }
  return { dias, res, control, insumos };
}

// ---------- precios diarios a partir de la configuración ----------
// Regenera data.precios para los insumos con tipo fijo/maiz/silo; los de tipo manual se conservan.
function precioMaizDia(cfg, fecha, prev) {
  const cot = (cfg.cotizaciones || []).filter(c => c.fecha && c.precio_tn > 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (!cot.length) return prev ?? (cfg.piso || 0);
  let q = null; for (const c of cot) { if (c.fecha <= fecha) q = c; else break; }
  if (!q) q = cot[0];                              // antes de la primera cotización del mes se usa la primera (como la planilla)
  const p = (q.precio_tn - (cfg.flete_largo || 0) + (cfg.flete_corto || 0)) / 1000;
  return Math.max(p, cfg.piso || 0);
}
function recalcPrecios(data) {
  const dias = diasDelMes(data.periodo.mes); const pc = data.precios_config || (data.precios_config = periodoVacio(data.periodo.mes).precios_config);
  const manual = {}; data.precios.forEach(p => manual[p.fecha + '|' + p.insumo] = p.precio);
  const out = []; const maiz = {}; let prev = null;
  for (const d of dias) { prev = precioMaizDia(pc.maiz || {}, d, prev); maiz[d] = prev; }
  const sc = pc.silo || {}; const coef = (sc.rendimiento || 0) * (sc.factor || 0) / 10000;
  for (const i of data.insumos) {
    const t = i.tipo || 'manual';
    for (const d of dias) {
      let v;
      if (t === 'fijo') v = (i.base || 0) * (1 + (i.merma || 0));
      else if (t === 'maiz') v = maiz[d];
      else if (t === 'silo') v = (maiz[d] + (sc.adicional || 0)) * coef;
      else { v = manual[d + '|' + i.nombre]; if (v === undefined) continue; }
      out.push({ fecha: d, insumo: i.nombre, precio: Math.round(v * 10000) / 10000 });
    }
  }
  data.precios = out;
}
const TIPOS_PRECIO = { fijo: 'Fijo mensual + merma', maiz: 'Maíz (cotización)', silo: 'Silo (fórmula sobre maíz)', manual: 'Manual por día' };

// ---------- estado y persistencia local ----------
const LS_KEY = 'hoteleria.periodos.v1', LS_CFG = 'hoteleria.config.v1';
const state = {
  periodos: lsGet(LS_KEY, {}),         // mes -> documento
  mes: null, data: null, calc: null, tab: 'control',
  cfg: Object.assign({ modo: 'supabase', sbUrl: 'https://xqcipsnyvnozkvehpzsk.supabase.co', sbKey: 'sb_publishable_3KDY3ojS6VUHhQCUrfxKQg_JRUS7PMu', syncUrl: 'http://localhost:8766' }, lsGet(LS_CFG, {})),
  sb: null, user: null, dirty: false, filtroHot: '', liqHot: '', liqDetalle: false,
};
function setData(doc) { state.data = doc; state.mes = doc.periodo.mes; state.periodos[state.mes] = doc; recalc(); }
function recalc() { state.calc = calcular(state.data); actualizarPills(); }
function marcar() { state.dirty = true; recalc(); guardarLocal(true); state.dirty = true; actualizarPills(); }
function guardarLocal(silencioso) { const ok = lsSet(LS_KEY, state.periodos); if (!silencioso) toast(ok ? 'Guardado en este navegador' : 'No se pudo guardar en el navegador'); if (ok) state.dirty = false; actualizarPills(); }
function cargarDemo() {
  try { const raw = $('#demo-data').textContent.trim(); if (!raw || raw.startsWith('__')) return null; return JSON.parse(raw); } catch (e) { return null; }
}
function actualizarPills() {
  const c = state.calc; const maxDif = Math.max(0, ...c.control.map(x => Math.abs(x.dif)));
  const conDatos = c.control.filter(x => x.conDatos).length;
  const p = $('#pillCierre'); p.className = 'pill ' + (conDatos === 0 ? 'warn' : maxDif < 0.01 ? 'ok' : 'bad');
  p.textContent = conDatos === 0 ? 'Sin datos de alimentación' : maxDif < 0.01 ? `Cierre diario OK · ${conDatos} días` : `Cierre con diferencia ${fmtN(maxDif, 1)} kg`;
  const m = $('#pillModo'); m.className = 'pill ' + (state.cfg.modo === 'supabase' ? (state.user ? 'ok' : 'warn') : '');
  m.textContent = state.cfg.modo === 'supabase' ? (state.user ? `Supabase · ${state.user.email}` : 'Supabase · sin sesión') : 'Modo local';
  $('#btnGuardar').textContent = state.dirty ? 'Guardar •' : 'Guardar';
}
</script>

  </tbody></table></div></div>
  <div class="panel"><header><h2>Cierre diario</h2><span class="sub">Kilos alimentados vs. kilos asignados a hoteleros. La diferencia tiene que ser 0 todos los días.</span></header>

  ${c.control.map(x => `<tr class="${x.conDatos ? '' : 'sub'}"><td>${fmtFecha(x.fecha)}</td><td class="n">${fmtN(x.total)}</td><td class="n">${fmtN(x.cabezas)}</td><td class="n">${fmtN(x.baseHeads)}</td><td class="n">${fmtN(x.kgcab, 2)}</td>${hots.map(h => `<td class="n ${(x.porHot[h.id] || 0) < -0.01 ? 'bad' : ''}">${fmtN(x.porHot[h.id])}</td>`).join('')}<td class="n">${fmtN(x.asignado)}</td><td class="n ${Math.abs(x.dif) < 0.01 ? 'ok' : 'bad'}">${fmtN(x.dif, 1)}</td></tr>`).join('')}

    <td class="n">${sug[h.id] !== undefined ? `${fmtN(sug[h.id])} ${sug[h.id] !== (h.stock_inicial || 0) ? `<button class="small" data-usar="${i}" title="Copiar el sugerido al stock inicial">usar</button>` : ''}` : '<span class="muted">—</span>'}</td>

  $$('[data-usar]', main).forEach(b => b.onclick = () => { const h = hots[+b.dataset.usar]; h.stock_inicial = sug[h.id]; marcar(); render(); });
  $$('[data-del]', main).forEach(b => b.onclick = () => { const h = hots[+b.dataset.del]; if (b.dataset.conf) { hots.splice(+b.dataset.del, 1); marcar(); render(); } else { b.textContent = `Quitar ${h.nombre}?`; b.dataset.conf = '1'; } });

// ---------- 3. Parámetros y precios ----------
function renderParametros(main) {
  const P = state.data.periodo, ins = state.data.insumos, dias = state.calc.dias;
  const pc = state.data.precios_config || (state.data.precios_config = periodoVacio(P.mes).precios_config);

  main.innerHTML = `

  </tbody></table></div>
  <p class="small muted" style="margin:8px 0 0">Fijo: precio base del mes × (1 + merma). Maíz: (cotización del día − valor a restar + valor a sumar) ÷ 1000, con piso; los días sin cotización repiten la última. Silo: (maíz + adicional) × rendimiento × factor ÷ 10.000.</p></div>

// lee un Excel/CSV de cotizaciones y prepara la elección de columnas
function leerCotizaciones(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('La librería de Excel no cargó (sin conexión).'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    let rows;
    try { const wb = XLSX.read(rd.result, { type: 'array', cellDates: true }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null }); }
    catch (e) { toast('No se pudo leer el archivo: ' + e.message); return; }
    rows = rows.filter(r => r.some(v => v !== null && v !== ''));
    if (!rows.length) { toast('El archivo está vacío'); return; }
    // encabezado = primera fila con 2+ celdas de texto; si no hay, columnas A, B, C…
    let hi = rows.findIndex(r => r.filter(v => typeof v === 'string' && v.trim()).length >= 2); if (hi < 0) hi = -1;
    const ncol = Math.max(...rows.map(r => r.length));
    const hdr = Array.from({ length: ncol }, (_, k) => (hi >= 0 && rows[hi][k] != null && String(rows[hi][k]).trim()) ? String(rows[hi][k]).trim() : 'Columna ' + String.fromCharCode(65 + k));
    const body = rows.slice(hi + 1);
    const score = k => ({ f: body.filter(r => fechaDe(r[k])).length, p: body.filter(r => { const n = numDe(r[k]); return n !== null && n > 1000; }).length });
    const sc = hdr.map((_, k) => score(k));
    const colFecha = sc.reduce((b, s, k) => s.f > sc[b].f ? k : b, 0);
    const colPrecio = sc.reduce((b, s, k) => (k !== colFecha && s.p > (b < 0 ? -1 : sc[b].p)) ? k : b, -1);
    state.impCot = { nombre: file.name, rows: body, hdr, colFecha, colPrecio: colPrecio < 0 ? (colFecha === 0 ? 1 : 0) : colPrecio };
    state.impCot.previa = previaCotizaciones(state.impCot); render();
  };
  rd.readAsArrayBuffer(file);
}
function previaCotizaciones(imp) {
  const mes = state.data.periodo.mes, out = {};
  imp.rows.forEach(r => { const f = fechaDe(r[imp.colFecha]), p = numDe(r[imp.colPrecio]); if (f && p !== null && p > 0 && f.startsWith(mes)) out[f] = p; });
  return Object.entries(out).map(([fecha, precio_tn]) => ({ fecha, precio_tn })).sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function fechaDe(v) {
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
  if (typeof v === 'string') { let m = v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; } m = v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0]; }
  return null;
}
function numDe(v) { if (typeof v === 'number') return isNaN(v) ? null : v; if (typeof v === 'string') { const s = v.replace(/[$\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? null : n; } return null; }

// Importa filas de alimentación (JSON array o CSV con encabezados fecha,corral,insumo,kg) reemplazando las del mes.
function importarArchivo(file, coleccion) {
  if (!file) return; const rd = new FileReader();
  rd.onload = () => {
    let rows; try { rows = file.name.toLowerCase().endsWith('.csv') ? parseCSV(rd.result) : JSON.parse(rd.result); } catch (e) { toast('No se pudo leer el archivo: ' + e.message); return; }
    if (!Array.isArray(rows)) rows = rows[coleccion] || [];
    const mes = state.data.periodo.mes; const ok = rows.filter(r => r.fecha && String(r.fecha).startsWith(mes));
    state.data.alimentacion = ok.map(r => ({ fecha: r.fecha, corral: String(r.corral || 'GENERAL').trim(), insumo: String(r.insumo).trim(), kg: num(r.kg) }));
    const known = new Set(state.data.insumos.map(i => i.nombre)); ok.forEach(r => { if (!known.has(r.insumo)) { state.data.insumos.push({ nombre: r.insumo, humedad: 0 }); known.add(r.insumo); } });
    marcar(); render(); toast(`${ok.length} filas importadas (${rows.length - ok.length} fuera del mes descartadas)`);
  };
  rd.readAsText(file);
}
function parseCSV(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim()); const sep = lines[0].includes(';') ? ';' : ',';
  const head = lines[0].split(sep).map(s => s.trim().toLowerCase());
  return lines.slice(1).map(l => { const c = l.split(sep); const o = {}; head.forEach((h, i) => o[h] = (c[i] || '').trim()); if (o.fecha && o.fecha.includes('/')) { const [d, m, y] = o.fecha.split('/'); o.fecha = `${y}-${m}-${d}`; } return o; });
}

function normalizarDoc(doc) {
  const base = periodoVacio(doc.periodo.mes); const out = { ...base, ...doc, periodo: { ...base.periodo, ...doc.periodo } };

  ['alimentacion', 'movimientos', 'precios'].forEach(k => out[k] = doc[k] || []); out.stock_sugerido = doc.stock_sugerido || {};
  out.hoteleros.forEach(h => { if (h.precio_hoteleria === undefined) h.precio_hoteleria = null; });
  if (!out.insumos || !out.insumos.length) out.insumos = base.insumos;
  out.insumos.forEach(i => { if (!i.tipo) i.tipo = 'manual'; });
  out.precios_config = { ...base.precios_config, ...(doc.precios_config || {}) };
  return out;
}

  const last = {}; state.data.precios.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(p => last[p.insumo] = p.precio);
  diasDelMes(mes).forEach(d => Object.entries(last).forEach(([i, p]) => doc.precios.push({ fecha: d, insumo: i, precio: p })));
  doc.precios_config = JSON.parse(JSON.stringify(state.data.precios_config || periodoVacio(mes).precios_config)); doc.precios_config.maiz.cotizaciones = [];
  recalcPrecios(doc);
  setData(doc); marcar(); render(); toast(`Período ${fmtMes(mes)} creado con el stock final de ${fmtMes(state.mes === mes ? mes : Object.keys(state.periodos).sort().slice(-2)[0])} como inicial`);
}

// ---------- Tomar información (servicio local en la PC de la oficina) ----------
async function tomarInformacion() {
  const url = (state.cfg.syncUrl || 'http://localhost:8766').replace(/\/$/, '');
  const b = $('#btnTomar'); if (b) { b.disabled = true; b.textContent = '⟳ Tomando…'; }
  toast('Tomando información de Nutrir FL y WinCampo para ' + fmtMes(state.mes) + '…', 10000);
  try {
    const resp = await fetch(`${url}/tomar?mes=${state.mes}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await resp.text()).slice(0, 200));
    aplicarInformacion(await resp.json());
  } catch (e) {
    toast(`No se pudo tomar la información (${e.message}). El servicio tiene que estar corriendo en la PC de la oficina (${url}); si no, importá el JSON desde Datos y conexión.`, 8000);
  } finally { if (b) { b.disabled = false; b.textContent = '⟳ Tomar información'; } }
}
// Aplica al período abierto lo que devuelve el servicio: {mes, alimentacion[], movimientos[], stock_sugerido{}, avisos[]}
function aplicarInformacion(j) {
  if (j.mes && j.mes !== state.mes) { toast(`El servicio devolvió ${fmtMes(j.mes)} y el período abierto es ${fmtMes(state.mes)}.`, 6000); return; }
  const doc = state.data, mes = state.mes;
  const ali = (j.alimentacion || []).filter(a => a.fecha && a.fecha.startsWith(mes)).map(a => ({ fecha: a.fecha, corral: String(a.corral || 'GENERAL').trim(), insumo: String(a.insumo).trim(), kg: num(a.kg) }));
  const known = new Set(doc.insumos.map(i => i.nombre)); ali.forEach(a => { if (!known.has(a.insumo)) { doc.insumos.push({ nombre: a.insumo, humedad: 0 }); known.add(a.insumo); } });
  if (ali.length) doc.alimentacion = ali;
  const ids = new Set(doc.hoteleros.map(h => h.id)); const nuevos = [];
  const movs = (j.movimientos || []).filter(m => m.fecha && m.fecha.startsWith(mes) && m.hotelero && m.cabezas).map(m => {
    if (!ids.has(m.hotelero)) { ids.add(m.hotelero); nuevos.push(m.hotelero); doc.hoteleros.push({ id: m.hotelero, nombre: m.hotelero, razon_social: '', cuit: '', tratamiento: 'propio', ajuste_pct: 0, ajuste_kg: 0, corrales: [], stock_inicial: 0, precio_hoteleria: null, paga_hoteleria: true, paga_sanidad: true, activo: true }); }
    return { fecha: m.fecha, hotelero: m.hotelero, tipo: m.tipo, cabezas: Math.round(num(m.cabezas)), tropa: m.tropa || '', sanidad: m.tipo === 'ingreso' ? m.sanidad !== false : false, origen: 'sistema' };
  });
  const manuales = doc.movimientos.filter(m => m.origen !== 'sistema');
  if (movs.length) doc.movimientos = manuales.concat(movs);
  if (j.stock_sugerido) doc.stock_sugerido = Object.fromEntries(Object.entries(j.stock_sugerido).map(([k, v]) => [k, Math.round(num(v))]));
  marcar(); render();
  toast(`Información tomada: ${ali.length} filas de alimentación, ${movs.length} movimientos del sistema (${manuales.length} manuales conservados)${nuevos.length ? ', hoteleros nuevos: ' + nuevos.join(', ') : ''}${(j.avisos || []).length ? ' · ' + j.avisos.join(' · ') : ''}`, 9000);
}

// ---------- Supabase ----------
// Las tablas viven en el proyecto de Caravanas Pecuaria con prefijo hot_ (ver supabase_schema.sql)
const SB_PREFIX = 'hot_'; const T = n => SB_PREFIX + n;
function sbClient() {
  if (state.sb) return state.sb; const { sbUrl, sbKey } = state.cfg;
  if (!sbUrl || !sbKey || typeof supabase === 'undefined') { toast('Completá URL y anon key de Supabase'); return null; }
  state.sb = supabase.createClient(sbUrl, sbKey); return state.sb;
}
async function sbLogin(email, pass) {
  const sb = sbClient(); if (!sb) return; const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { toast('No se pudo ingresar: ' + error.message); return; } state.user = data.user; actualizarPills(); render(); toast('Sesión iniciada'); sbCargarPeriodos();
}
async function sbLogout() { const sb = sbClient(); if (sb) await sb.auth.signOut(); state.user = null; actualizarPills(); render(); }
async function sbSesion() { if (state.cfg.modo !== 'supabase') return; const sb = sbClient(); if (!sb) return; const { data } = await sb.auth.getSession(); state.user = data.session ? data.session.user : null; actualizarPills(); if (state.user) await sbCargarPeriodos(); else if (state.tab !== 'datos') { state.tab = 'datos'; render(); toast('Ingresá con tu usuario para ver los datos en la nube'); } }
async function sbCargarPeriodos() {
  const sb = sbClient(); if (!sb) return; toast('Trayendo datos…');
  // Supabase devuelve como máximo 1000 filas por llamada: se pagina hasta traer todo
  const q = async (t, f) => { const out = []; const PAGE = 1000; for (let from = 0; ; from += PAGE) { let qq = sb.from(t).select('*').order(t === T('periodos') ? 'mes' : 'id', { ascending: true }); if (f) qq = qq.eq('mes', f); const { data, error } = await qq.range(from, from + PAGE - 1); if (error) throw new Error(t + ': ' + error.message); out.push(...data); if (data.length < PAGE) break; } return out; };
  try {
    const per = await q(T('periodos')); const hots = await q(T('hoteleros'));
    for (const p of per) {
      const doc = periodoVacio(p.mes); doc.periodo = { mes: p.mes, markup: +p.markup, precio_hoteleria: +p.precio_hoteleria, precio_sanidad: +p.precio_sanidad, iva: +p.iva, estado: p.estado };
      if (p.insumos && p.insumos.length) doc.insumos = p.insumos;
      if (p.precios_config) doc.precios_config = p.precios_config;
      const stk = p.stock_inicial || {}; doc.stock_sugerido = p.stock_sugerido || {};
      doc.hoteleros = hots.map(h => ({ id: h.id, nombre: h.nombre, razon_social: h.razon_social || '', cuit: h.cuit || '', tratamiento: h.tratamiento, ajuste_pct: +h.ajuste_pct || 0, ajuste_kg: +h.ajuste_kg || 0, corrales: h.corrales || [], stock_inicial: +(stk[h.id] || 0), precio_hoteleria: h.precio_hoteleria === null || h.precio_hoteleria === undefined ? null : +h.precio_hoteleria, paga_hoteleria: h.paga_hoteleria !== false, paga_sanidad: h.paga_sanidad !== false, activo: h.activo !== false }));
      doc.alimentacion = (await q(T('alimentacion'), p.mes)).map(r => ({ fecha: r.fecha, corral: r.corral, insumo: r.insumo, kg: +r.kg }));
      doc.movimientos = (await q(T('movimientos'), p.mes)).map(r => ({ fecha: r.fecha, hotelero: r.hotelero, tipo: r.tipo, cabezas: +r.cabezas, tropa: r.tropa || '', sanidad: !!r.sanidad, origen: r.origen || 'manual' }));
      doc.precios = (await q(T('precios'), p.mes)).map(r => ({ fecha: r.fecha, insumo: r.insumo, precio: +r.precio }));
      state.periodos[p.mes] = doc;
    }
    if (per.length) setData(state.periodos[per.map(p => p.mes).sort().pop()]); lsSet(LS_KEY, state.periodos); render(); toast(per.length ? `${per.length} período(s) cargados de la nube` : 'Todavía no hay períodos en la nube: cargá o creá uno y apretá Guardar');
  } catch (e) { toast('Error al traer datos: ' + e.message, 5000); }
}
async function sbGuardarPeriodo(doc) {
  const sb = sbClient(); if (!sb || !state.user) { toast('Iniciá sesión en Supabase primero'); return; }
  const mes = doc.periodo.mes; toast('Subiendo ' + fmtMes(mes) + '…');
  try {
    let r = await sb.from(T('hoteleros')).upsert(doc.hoteleros.map(h => ({ id: h.id, nombre: h.nombre, razon_social: h.razon_social, cuit: h.cuit, tratamiento: h.tratamiento, ajuste_pct: h.ajuste_pct || 0, ajuste_kg: h.ajuste_kg || 0, corrales: h.corrales || [], precio_hoteleria: h.precio_hoteleria ?? null, paga_hoteleria: h.paga_hoteleria !== false, paga_sanidad: h.paga_sanidad !== false, activo: h.activo !== false }))); if (r.error) throw r.error;
    r = await sb.from(T('periodos')).upsert({ mes, markup: doc.periodo.markup, precio_hoteleria: doc.periodo.precio_hoteleria, precio_sanidad: doc.periodo.precio_sanidad, iva: doc.periodo.iva, estado: doc.periodo.estado || 'abierto', insumos: doc.insumos, precios_config: doc.precios_config || {}, stock_inicial: Object.fromEntries(doc.hoteleros.map(h => [h.id, h.stock_inicial || 0])), stock_sugerido: doc.stock_sugerido || {} }); if (r.error) throw r.error;
    for (const [t, rows] of [[T('alimentacion'), doc.alimentacion], [T('movimientos'), doc.movimientos], [T('precios'), doc.precios]]) {
      r = await sb.from(t).delete().eq('mes', mes); if (r.error) throw r.error;
      for (let i = 0; i < rows.length; i += 500) { r = await sb.from(t).insert(rows.slice(i, i + 500).map(x => ({ mes, ...x }))); if (r.error) throw r.error; }
    }
    state.dirty = false; actualizarPills(); toast('Período guardado en Supabase');
  } catch (e) { toast('Error al guardar: ' + (e.message || e), 6000); }
}

// ---------- arranque ----------
function init() {
  const meses = Object.keys(state.periodos).sort();
  if (meses.length) setData(state.periodos[meses[meses.length - 1]]);
  else { const demo = cargarDemo(); setData(demo ? normalizarDoc(demo) : periodoVacio(new Date().toISOString().slice(0, 7))); if (demo) lsSet(LS_KEY, state.periodos); }
  $$('#tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  $('#selPeriodo').onchange = e => { setData(state.periodos[e.target.value]); render(); };
  $('#btnNuevoPeriodo').onclick = nuevoPeriodo;
  $('#btnTomar').onclick = tomarInformacion;
  $('#btnGuardar').onclick = () => { if (state.cfg.modo === 'supabase') sbGuardarPeriodo(state.data); else guardarLocal(false); };
  const hash = location.hash.replace('#', ''); if (hash && $(`#tabs [data-tab="${hash}"]`)) state.tab = hash;
  render(); sbSesion();
}
init();
</script>
